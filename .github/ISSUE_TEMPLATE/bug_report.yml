name: Bug report / 버그 신고
description: Something in the 100doo desktop app (macOS) is not working. / 100doo 데스크톱 앱이 제대로 동작하지 않을 때
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version / 앱 버전
      description: "Finder → Applications → 100doo → Get Info. / Finder → 응용 프로그램 → 100doo → 정보 가져오기"
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip / Mac 칩
      options: ["Apple Silicon", "Intel"]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version / macOS 버전
      placeholder: "15.4"
    validations:
      required: true
  - type: dropdown
    id: with-extension
    attributes:
      label: Used with the VS Code extension? / VS Code 확장과 함께 쓰나요?
      options: ["Yes / 예", "No — app only / 아니요, 앱만"]
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 무슨 일이 있었나요?
      description: What you expected and what you saw instead. / 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 방법
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: log
    attributes:
      label: Diagnostics log / 진단 로그
      description: "Tray menu → Open diagnostics log, then paste the last lines. Remove anything private first. / 트레이 메뉴 → 진단 로그 열기에서 마지막 부분을 붙여 주세요. 개인 정보는 지운 뒤 붙여 주세요."
      render: text
